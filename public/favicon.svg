<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#0f172a"/>
  
  <!-- Buildings - back layer -->
  <rect x="2"  y="18" width="6"  height="14" fill="#1e3a5f"/>
  <rect x="4"  y="14" width="2"  height="4"  fill="#1e3a5f"/>
  <rect x="10" y="12" width="7"  height="20" fill="#1e3a5f"/>
  <rect x="13" y="8"  width="2"  height="4"  fill="#1e3a5f"/>
  <rect x="20" y="15" width="5"  height="17" fill="#1e3a5f"/>
  <rect x="26" y="20" width="4"  height="12" fill="#1e3a5f"/>

  <!-- Buildings - front layer -->
  <rect x="0"  y="22" width="5"  height="10" fill="#1d4ed8"/>
  <rect x="7"  y="16" width="5"  height="16" fill="#1d4ed8"/>
  <rect x="9"  y="12" width="2"  height="4"  fill="#1d4ed8"/>
  <rect x="14" y="19" width="4"  height="13" fill="#1d4ed8"/>
  <rect x="20" y="14" width="6"  height="18" fill="#1d4ed8"/>
  <rect x="22" y="10" width="2"  height="4"  fill="#1d4ed8"/>
  <rect x="27" y="18" width="5"  height="14" fill="#1d4ed8"/>

  <!-- Windows -->
  <rect x="8"  y="18" width="2" height="2" fill="#fbbf24" opacity="0.9"/>
  <rect x="11" y="14" width="2" height="2" fill="#93c5fd" opacity="0.9"/>
  <rect x="11" y="18" width="2" height="2" fill="#fbbf24" opacity="0.9"/>
  <rect x="15" y="21" width="1" height="1" fill="#93c5fd" opacity="0.9"/>
  <rect x="21" y="16" width="2" height="2" fill="#fbbf24" opacity="0.9"/>
  <rect x="21" y="20" width="2" height="2" fill="#93c5fd" opacity="0.9"/>
  <rect x="24" y="12" width="2" height="2" fill="#fbbf24" opacity="0.9"/>
  <rect x="28" y="20" width="2" height="2" fill="#93c5fd" opacity="0.9"/>

  <!-- Moon -->
  <circle cx="26" cy="5" r="3" fill="#fef9c3" opacity="0.85"/>

  <!-- Grid overlay - subtle hint of the puzzle -->
  <rect x="2" y="2" width="5" height="5" rx="1" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.6"/>
  <rect x="8" y="2" width="5" height="5" rx="1" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.4"/>
  <rect x="2" y="8" width="5" height="5" rx="1" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.4"/>
  <rect x="8" y="8" width="5" height="5" rx="1" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.2"/>
</svg>